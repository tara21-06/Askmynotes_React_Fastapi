<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AskMyNotes</title>
  <!-- Tailwind Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 py-8 text-center px-4">
    <h1 class="text-4xl font-extrabold tracking-tight text-indigo-600 mb-2">
      AskMyNotes
    </h1>
    <p class="text-slate-500 text-lg">
      Upload a PDF. Ask a question. Get a grounded answer.
    </p>
  </header>

  <main class="flex-grow container mx-auto max-w-2xl p-6">
    
    <div class="bg-white shadow-xl rounded-2xl p-8 border border-slate-100">
      
      <!-- Upload Section -->
      <section class="mb-8">
        <label for="pdf-input" class="block text-sm font-semibold text-slate-700 mb-2">
          Upload your notes (PDF)
        </label>
        <div class="flex items-center justify-center w-full">
          <label for="pdf-input" class="flex flex-col items-center justify-center w-full h-32 border-2 border-slate-300 border-dashed rounded-lg cursor-pointer bg-slate-50 hover:bg-slate-100 transition-colors">
            <div class="flex flex-col items-center justify-center pt-5 pb-6">
              <svg class="w-8 h-8 mb-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
              <p class="mb-2 text-sm text-slate-500"><span class="font-semibold">Click to upload</span> or drag and drop</p>
            </div>
            <input type="file" id="pdf-input" class="hidden" accept="application/pdf">
          </label>
        </div>
        <p id="upload-status" class="mt-2 text-sm text-indigo-600 font-medium"></p>
      </section>

      <!-- Question Section -->
      <section class="space-y-4">
        <div>
          <label for="question" class="block text-sm font-semibold text-slate-700 mb-2">
            Your question
          </label>
          <textarea
            id="question"
            rows="3"
            class="w-full p-4 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all resize-none"
            placeholder="What does this document say about...?"
          ></textarea>
        </div>

        <button 
          id="ask-btn" 
          type="button"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl transition-all shadow-lg shadow-indigo-200 active:scale-[0.98]"
        >
          Submit Question
        </button>

        <p id="status" class="text-center text-sm text-slate-400 animate-pulse"></p>
      </section>

      <hr class="my-8 border-slate-100">

      <!-- Answer Section -->
      <section>
        <div id="answer" class="hidden animate-in fade-in slide-in-from-bottom-4 duration-500">
          <h2 class="text-xl font-bold text-slate-800 mb-4 flex items-center">
            <span class="bg-indigo-100 text-indigo-600 p-1 rounded mr-2">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
            </span>
            Answer
          </h2>

          <div class="flex gap-2 mb-4">
            <span id="qtype-pill" class="hidden px-2 py-1 bg-amber-100 text-amber-700 text-xs font-bold rounded-full uppercase tracking-wider"></span>
            <span id="tool-pill" class="hidden px-2 py-1 bg-blue-100 text-blue-700 text-xs font-bold rounded-full uppercase tracking-wider"></span>
          </div>

          <p id="answer-text" class="text-slate-700 leading-relaxed bg-slate-50 p-4 rounded-xl border border-slate-100"></p>

          <details id="sources" class="mt-6 group hidden">
            <summary class="list-none cursor-pointer font-semibold text-sm text-indigo-600 flex items-center">
              <svg class="w-4 h-4 mr-1 transition-transform group-open:rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"></path></svg>
              View Sources
            </summary>
            <ul id="sources-list" class="mt-3 space-y-2 text-sm text-slate-500 border-l-2 border-indigo-100 ml-2 pl-4"></ul>
          </details>
        </div>
      </section>

    </div>
  </main>

  <footer class="text-center py-8 text-slate-400 text-sm">
    <p>Built in the <span class="font-semibold text-slate-600">AI Engineering Bootcamp</span>.</p>
  </footer>

  <script src="app.js" defer></script>

</body>
</html>
